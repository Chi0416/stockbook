<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://sheets.googleapis.com https://www.googleapis.com https://oauth2.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="記錄簿">

  <link rel="manifest" href="manifest.json?v=2026.11.13.4">
  <link rel="icon" type="image/png" href="icons/book-192.png">
  <link rel="apple-touch-icon" href="icons/book-180.png">
  <title>股票記錄簿</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&display=swap" media="print">
  <link rel="stylesheet" href="css/style.css?v=2026.11.13.4">
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="appbar-title">
        <h1 id="page-title">交易紀錄</h1>

        <span id="page-sub" class="page-sub" hidden></span>
      </div>
      <div class="appbar-actions">

        <button id="btn-add" class="add-btn" type="button" aria-label="新增記錄">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>新增<span class="add-what">記錄</span></span>
        </button>

        <button id="btn-inbox" class="icon-btn inbox-btn" type="button" aria-label="訊息">
          <svg class="line" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.6a2.2 2.2 0 0 0 4 0"/></svg>
          <span id="inbox-count" class="count-badge" hidden></span>
        </button>
        <button id="btn-menu" class="icon-btn" type="button" aria-label="設定：家庭成員、雲端同步、資料備份">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </header>

    <div id="subtabs" class="subtabs" role="tablist" hidden></div>

    <button id="scope-bar" class="scope-bar" type="button" hidden>
      <span class="scope-label">只顯示</span><span class="scope-names"></span><span class="scope-go" aria-hidden="true">›</span>
    </button>
    <div id="banner" class="banner" hidden></div>

    <div id="sync-bar" class="sync-bar" role="status" hidden>
      <span class="sync-text"></span>
      <button type="button" class="sync-btn"></button>
    </div>
    <main id="panels"></main>
  </div>

  <nav class="tabbar">
    <div class="side-brand">股票記錄簿</div>
    <div class="tabbar-inner" role="tablist">
      <button type="button" role="tab" data-tab="overview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>
        <span>總覽</span>
      </button>

      <button type="button" role="tab" data-tab="market">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 17.5 9 11.5l4 4 7.5-8.5"/><path d="M15.5 7h5v5"/></svg>
        <span>行情</span>
      </button>

      <button type="button" role="tab" data-tab="income">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.3c-.5-.8-1.4-1.3-2.6-1.3-1.5 0-2.6.8-2.6 1.9 0 2.6 5.2 1.4 5.2 4.1 0 1.1-1.1 2-2.6 2-1.2 0-2.2-.5-2.7-1.3M12 6.5V8M12 16v1.5"/></svg>
        <span>股利</span>
      </button>

      <button type="button" role="tab" data-tab="book">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
        <span>帳務</span>
      </button>

      <button type="button" role="tab" data-tab="picks" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>選股</span>
      </button>
    </div>
  </nav>


  <dialog id="form-sheet" class="sheet">
    <div class="sheet-head">
      <button type="button" class="text-btn" data-act="close">取消</button>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn strong" data-act="save">儲存</button>
    </div>
    <div class="sheet-body">
      <p class="sheet-status" hidden></p>
      <div class="fields"></div>
      <button type="button" class="wide-btn danger" data-act="delete" hidden>刪除這筆</button>
    </div>
  </dialog>


  <dialog id="menu-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title">設定</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body">

      <label class="switch-row">
        <span class="switch-text"><b>隱藏金額</b><small>只顯示除權息日、每股股利這些公開資訊，自己的金額、股數都變成 ***</small></span>
        <input id="hide-amounts" type="checkbox" role="switch">
      </label>

      <label class="switch-row">
        <span class="switch-text"><b>詳細卡片</b><small>清單改成一筆一張卡片，每一筆的資料都寫出來；關掉是精簡的表格，一個畫面放得下比較多筆</small></span>
        <input id="show-cards" type="checkbox" role="switch">
      </label>


      <h3 id="members-head" class="section-head">家庭成員</h3>
      <ul id="member-list" class="member-list"></ul>
      <button id="btn-add-member" type="button" class="wide-btn">新增成員</button>
      <p class="note muted">交易紀錄和庫存快照分開記在每位成員名下；除權息和自選全家共用一份，股利依各人持股計算。名字最多 5 個字。</p>


      <h3 id="kd-head" class="section-head">KD 標記</h3>
      <ul class="member-list kd-marks">
        <li>
          <label class="member-info" for="kd-low"><b>K 值低於這個數字</b><small>綠色</small></label>
          <select id="kd-low"></select>
        </li>
        <li>
          <label class="member-info" for="kd-high"><b>K 值高於這個數字</b><small>紅色</small></label>
          <select id="kd-high"></select>
        </li>
      </ul>
      <p class="note muted">行情點開一檔的 KD 圖用的，這兩個數字畫虛線，D 值也照同樣的數字上色。只記在這台裝置。</p>

      <h3 class="section-head">Google 雲端硬碟</h3>
      <div id="cloud"></div>

      <h3 class="section-head">資料備份</h3>
      <dl id="stats" class="stats"></dl>
      <p id="last-export" class="muted"></p>
      <button id="btn-export" type="button" class="wide-btn primary">匯出 data.json</button>
      <button id="btn-import" type="button" class="wide-btn">匯入 data.json</button>
      <p class="note muted">備份檔包含全家的資料；匯入會以檔案內容取代目前所有資料。</p>
      <input id="file-import" type="file" accept=".json,application/json" hidden>

      <a class="wide-btn" href="help.html">使用說明</a>
      <p class="note muted"><a class="link-btn" href="privacy.html">隱私權政策</a></p>



      <p class="note muted">版本 2026.11.13.4</p>
    </div>
  </dialog>


  <dialog id="mine-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>


  <dialog id="stock-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title"></h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>


  <dialog id="screen-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title">篩選條件</h2>
      <button type="button" class="text-btn strong" data-act="close">完成</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>


  <dialog id="trend-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title">帳戶走勢</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>


  <dialog id="taiex-sheet" class="sheet">
    <div class="sheet-head">
      <span></span>
      <h2 class="sheet-title">大盤</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body"></div>
  </dialog>


  <dialog id="inbox-sheet" class="sheet inbox">
    <div class="sheet-head">
      <button id="inbox-clear" type="button" class="text-btn">清除已讀</button>
      <h2 class="sheet-title">訊息</h2>
      <button type="button" class="text-btn" data-act="close">關閉</button>
    </div>
    <div class="sheet-body">
      <ul id="inbox-list" class="inbox-list"></ul>
      <div id="inbox-empty" class="inbox-empty" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4z"/><path d="M10 20.6a2.2 2.2 0 0 0 4 0"/></svg>
        <p>沒有訊息</p>
      </div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

</body>
