<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="登入測試">
  <meta name="robots" content="noindex">
  <title>登入測試</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #faf9f5; --fg: #1f1e1d; --muted: #6b6a65; --line: #e5e3dc; --card: #fff;
      --accent: #c96442; --ok: #2e7d4f; --bad: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #262624; --fg: #f0eee6; --muted: #a8a69e; --line: #3d3c38; --card: #30302e; --ok: #6cc28f; --bad: #f28b82; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    h1 { font-size: 22px; margin: 8px 0 4px; }
    h2 { font-size: 15px; margin: 0 0 8px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
    button { display: block; width: 100%; font: inherit; padding: 12px; margin: 8px 0 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .45; cursor: default; }
    .muted { color: var(--muted); font-size: 14px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-all; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: normal; }
    #log { font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; margin: 0; max-height: 260px; overflow: auto; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>登入測試</h1>
  <p class="muted">測試 Google 登入與試算表讀寫是否正常。測試完成後會刪除這一頁。</p>

  <section>
    <h2>狀態</h2>
    <dl>
      <dt>開啟方式</dt><dd id="s-mode"></dd>
      <dt>裝置</dt><dd id="s-device"></dd>
      <dt>登入</dt><dd id="s-login"></dd>
      <dt>帳號</dt><dd id="s-email"></dd>
      <dt>試算表</dt><dd id="s-sheet"></dd>
    </dl>
  </section>

  <section>
    <h2>1. 登入</h2>
    <button id="btn-popup" class="primary" type="button" disabled>方法 A：彈出視窗登入</button>
    <button id="btn-redirect" type="button">方法 B：整頁跳轉登入</button>
    <button id="btn-logout" type="button">清除這台裝置的登入</button>
  </section>

  <section>
    <h2>2. 試算表</h2>
    <button id="btn-write" class="primary" type="button">寫入一列測試資料</button>
    <button id="btn-read" type="button">讀取最近 5 列</button>
    <table id="rows" hidden>
      <thead><tr><th>時間</th><th>開啟方式</th><th>登入</th><th>裝置</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h2>紀錄</h2>
    <pre id="log"></pre>
    <button id="btn-copy" type="button">複製紀錄</button>
  </section>

  <p class="muted">測試頁版本 1</p>
</main>

<script>
  const CLIENT_ID = '413467413469-bjq1kita4e36v7e61jko64tnlqes127v.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.file';
  const KEY = { token: 'loginTest.token', email: 'loginTest.email', state: 'loginTest.state' };
  const SHEET_TAB = '測試紀錄';
  const $ = id => document.getElementById(id);

  // ---------- 本機儲存（無痕模式等不能存時也不會出錯） ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
    del(k) { try { localStorage.removeItem(k); } catch (_) {} },
  };

  // ---------- 環境 ----------
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const mode = standalone ? '主畫面 App' : '瀏覽器分頁';

  function deviceName() {
    const ua = navigator.userAgent;
    const ios = ua.match(/OS (\d+)_(\d+)/);
    const ver = ios ? ` iOS ${ios[1]}.${ios[2]}` : '';
    const browser = /CriOS/.test(ua) ? 'Chrome' : /FxiOS/.test(ua) ? 'Firefox' : /Safari/.test(ua) && !/Chrome/.test(ua) ? 'Safari' : /Chrome/.test(ua) ? 'Chrome' : '';
    const dev = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '其他';
    return `${dev}${ver}${browser ? ` · ${browser}` : ''}`;
  }

  // ---------- 紀錄 ----------
  function log(msg) {
    const t = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    $('log').textContent = `${t}  ${msg}\n${$('log').textContent}`;
  }

  // ---------- 登入權杖 ----------
  let token = null;
  try {
    const t = JSON.parse(store.get(KEY.token));
    if (t && t.expiresAt > Date.now()) token = t;
  } catch (_) {}
  let email = store.get(KEY.email) || '';
  let sheet = null;

  function saveToken(accessToken, expiresIn, via) {
    token = { accessToken, expiresAt: Date.now() + Number(expiresIn) * 1000, via };
    store.set(KEY.token, JSON.stringify(token));
  }

  const loggedIn = () => token && token.expiresAt > Date.now() + 10000;

  // ---------- 方法 A：Google 登入元件的彈出視窗 ----------
  let tokenClient = null;

  function gisReady() {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback(r) {
        if (r.error) { log(`方法 A 失敗：${r.error} ${r.error_description || ''}`); return; }
        saveToken(r.access_token, r.expires_in, '方法 A');
        log('方法 A 登入成功');
        afterLogin();
      },
      error_callback(e) { log(`方法 A 視窗問題：${e.type}${e.message ? ` ${e.message}` : ''}`); },
    });
    $('btn-popup').disabled = false;
  }

  function gisFailed() {
    log('無法載入 Google 登入元件，方法 A 不能用');
  }

  $('btn-popup').addEventListener('click', () => {
    const opts = email ? { prompt: '', login_hint: email } : { prompt: 'select_account' };
    tokenClient.requestAccessToken(opts);
  });

  // ---------- 方法 B：整頁跳轉到 Google 再跳回來 ----------
  const redirectUri = location.origin + location.pathname.replace(/index\.html$/, '');

  $('btn-redirect').addEventListener('click', () => {
    const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    store.set(KEY.state, state);
    const p = new URLSearchParams({
      client_id: CLIENT_ID,
      redirect_uri: redirectUri,
      response_type: 'token',
      scope: SCOPE,
      include_granted_scopes: 'true',
      state,
    });
    if (email) p.set('login_hint', email); else p.set('prompt', 'select_account');
    location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${p}`);
  });

  // 從 Google 跳回來時，網址 # 後面帶著權杖或錯誤
  function handleRedirect() {
    if (!/access_token|error/.test(location.hash)) return false;
    const h = new URLSearchParams(location.hash.slice(1));
    history.replaceState(null, '', location.pathname + location.search);
    const expected = store.get(KEY.state);
    store.del(KEY.state);
    if (h.get('error')) { log(`方法 B 失敗：${h.get('error')}`); return false; }
    if (!expected || h.get('state') !== expected) {
      log('方法 B：跳回來時對不上原本的頁面（可能跳回了不同的瀏覽器或視窗），不採用這次登入');
      return false;
    }
    saveToken(h.get('access_token'), h.get('expires_in'), '方法 B');
    log('方法 B 登入成功');
    return true;
  }

  $('btn-logout').addEventListener('click', () => {
    token = null; sheet = null;
    store.del(KEY.token);
    $('rows').hidden = true;
    log('已清除這台裝置的登入');
    render();
  });

  // ---------- Google API ----------
  async function api(url, opts = {}) {
    if (!loggedIn()) throw new Error('尚未登入或登入已過期');
    const res = await fetch(url, {
      ...opts,
      headers: { Authorization: `Bearer ${token.accessToken}`, 'Content-Type': 'application/json' },
    });
    const text = await res.text();
    let body = {};
    try { body = text ? JSON.parse(text) : {}; } catch (_) {}
    if (!res.ok) throw new Error(`${res.status} ${body.error?.message || text.slice(0, 200)}`);
    return body;
  }

  const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets';
  const DRIVE = 'https://www.googleapis.com/drive/v3';
  const range = r => encodeURIComponent(`${SHEET_TAB}!${r}`);

  async function loadAccount() {
    const r = await api(`${DRIVE}/about?fields=user(emailAddress)`);
    email = r.user.emailAddress;
    store.set(KEY.email, email);
    render();
  }

  // 找這個測試頁之前建立的試算表；沒有就建立一份
  async function ensureSheet() {
    if (sheet) return sheet;
    const q = encodeURIComponent("appProperties has { key='loginTest' and value='1' } and trashed=false");
    const found = await api(`${DRIVE}/files?q=${q}&fields=files(id,webViewLink)`);
    if (found.files.length) {
      sheet = { id: found.files[0].id, url: found.files[0].webViewLink };
      log('找到之前建立的測試試算表');
    } else {
      const s = await api(SHEETS, {
        method: 'POST',
        body: JSON.stringify({
          properties: { title: '股票記錄簿（登入測試）', locale: 'zh_TW', timeZone: 'Asia/Taipei' },
          sheets: [{ properties: { title: SHEET_TAB } }],
        }),
      });
      await api(`${DRIVE}/files/${s.spreadsheetId}?fields=id`, {
        method: 'PATCH',
        body: JSON.stringify({ appProperties: { loginTest: '1' } }),
      });
      await api(`${SHEETS}/${s.spreadsheetId}/values/${range('A1')}?valueInputOption=RAW`, {
        method: 'PUT',
        body: JSON.stringify({ values: [['時間', '開啟方式', '登入', '裝置']] }),
      });
      sheet = { id: s.spreadsheetId, url: s.spreadsheetUrl };
      log('已在雲端硬碟建立「股票記錄簿（登入測試）」');
    }
    render();
    return sheet;
  }

  async function writeRow() {
    const s = await ensureSheet();
    const row = [new Date().toLocaleString('zh-TW', { hour12: false }), mode, token.via, deviceName()];
    await api(`${SHEETS}/${s.id}/values/${range('A1')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
      method: 'POST',
      body: JSON.stringify({ values: [row] }),
    });
    log('已寫入一列');
    await readRows();
  }

  async function readRows() {
    const s = await ensureSheet();
    const r = await api(`${SHEETS}/${s.id}/values/${range('A:D')}`);
    const rows = (r.values || []).slice(1).slice(-5).reverse();
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    $('rows').querySelector('tbody').innerHTML = rows.length
      ? rows.map(row => `<tr>${[0, 1, 2, 3].map(i => `<td>${esc(row[i])}</td>`).join('')}</tr>`).join('')
      : '<tr><td colspan="4">還沒有資料</td></tr>';
    $('rows').hidden = false;
    log(`讀到 ${rows.length} 列`);
  }

  // 按鈕的錯誤都顯示在紀錄裡（手機上看不到開發者工具）
  const guard = fn => async () => {
    try { await fn(); } catch (e) { log(`錯誤：${e.message}`); }
    render();
  };
  $('btn-write').addEventListener('click', guard(writeRow));
  $('btn-read').addEventListener('click', guard(readRows));

  async function afterLogin() {
    render();
    await guard(loadAccount)();
    await guard(readRows)();
  }

  $('btn-copy').addEventListener('click', async () => {
    const text = `${mode} · ${deviceName()}\n${$('log').textContent}`;
    try { await navigator.clipboard.writeText(text); log('已複製紀錄'); } catch (_) { log('無法複製，請改用截圖'); }
  });

  // ---------- 畫面 ----------
  function render() {
    $('s-mode').textContent = mode;
    $('s-device').textContent = deviceName();
    if (loggedIn()) {
      const min = Math.max(0, Math.round((token.expiresAt - Date.now()) / 60000));
      $('s-login').innerHTML = `<span class="ok">已登入（${token.via}），剩 ${min} 分鐘</span>`;
    } else {
      $('s-login').innerHTML = token ? '<span class="bad">登入已過期，請重新登入</span>' : '<span class="bad">未登入</span>';
    }
    $('s-email').textContent = email || '—';
    $('s-sheet').innerHTML = sheet ? `<a href="${sheet.url}" target="_blank" rel="noopener">開啟試算表</a>` : '—';
    $('btn-write').disabled = $('btn-read').disabled = !loggedIn();
  }

  setInterval(render, 30000);

  // ---------- 啟動 ----------
  log(`開啟：${mode}`);
  if (handleRedirect()) afterLogin();
  else if (loggedIn()) { log('沿用這台裝置上次的登入'); afterLogin(); }
  render();
</script>
<script src="https://accounts.google.com/gsi/client" async onload="gisReady()" onerror="gisFailed()"></script>
</body>
</html>
